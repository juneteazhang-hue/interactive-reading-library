<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动精读</title><link rel="stylesheet" href="styles/reader.css"></head><body>
<div id="loadingState" class="reader-state">正在打开故事……</div><div id="errorState" class="reader-state" hidden><h1>没有找到这篇文章</h1><p>链接可能不完整，或者文章尚未加入资源库。</p><a href="index.html">← 返回资源库</a></div>
<main id="readerApp" class="app-shell" hidden><header class="topbar"><a class="library-back" href="index.html">← 资源库</a><div class="brand"><span class="brand-mark">IR</span><span id="bookBrand">Interactive Reading</span></div><div class="chapter-meta"><span id="bookGrade"></span><strong id="bookTitle"></strong></div><div class="top-actions"><button id="soundToggle" class="icon-btn" type="button" aria-label="朗读本页">🔊</button><button id="resetBtn" class="text-btn" type="button">重置进度</button></div></header>
<nav class="mobile-tabs" aria-label="移动端页面切换"><button class="mobile-tab active" data-panel="read" type="button">阅读</button><button class="mobile-tab" data-panel="explore" type="button">探索</button></nav>
<section id="readingWorkspace" class="workspace"><article id="readingPanel" class="reading-panel active-panel" aria-live="polite"><div class="paper-grain"></div><div class="eyebrow" id="nodeEyebrow"></div><h1 id="nodeTitle"></h1><p class="node-intro" id="nodeIntro"></p><div class="mission-card"><span class="mission-label">CURRENT MISSION</span><strong id="missionText"></strong></div><div id="storyText" class="story-text"></div><div class="reading-tools audio-tools"><audio id="paragraphAudio" controls preload="metadata" aria-label="本页英文段落朗读"></audio><button id="speakBtn" class="paper-btn" type="button">↻ 重新朗读</button><button id="translateBtn" class="paper-btn" type="button">中 显示句意</button></div><div id="translation" class="translation" hidden></div><section class="vocab-section" aria-labelledby="vocabHeading"><div class="section-heading"><span>VOCABULARY</span><h2 id="vocabHeading">重点词汇</h2></div><div id="vocabCards" class="vocab-cards"></div></section><div id="taskArea" class="task-area"></div></article>
<section id="scenePanel" class="scene-panel" aria-label="故事探索场景"><img id="sceneImage" class="scene-image" alt="故事插图"><div class="ambient-particles" aria-hidden="true"></div><div class="scene-vignette"></div><div class="scene-heading"><span id="sceneKicker"></span><strong id="sceneTitle"></strong></div><div id="bubbleLayer" class="bubble-layer" aria-label="互动问题浮标"></div><div id="toast" class="toast" role="status" aria-live="polite"></div></section></section>
<section id="retellingPage" class="retelling-page" hidden><div class="retell-head"><span>STORY RETELLING · PAGE 9</span><h1>八幅图复述故事</h1><p>先观察图片，再依次点击翻转卡片。最后尝试不看提示，用英语完整复述故事。</p><button id="resetCards" class="paper-btn" type="button">翻回全部图片</button></div><div id="retellGrid" class="retell-grid"></div></section>
<footer class="progress-footer"><button id="prevBtn" class="nav-btn" type="button">← 上一页</button><ol id="progressDots" class="progress-dots" aria-label="阅读进度"></ol><div class="progress-copy"><span id="progressText"></span><small id="progressLabel"></small></div><button id="nextBtn" class="nav-btn primary" type="button">下一页 →</button></footer></main>
<dialog id="quizDialog" class="quiz-dialog"><button class="quiz-close" type="button" aria-label="关闭题目">×</button><span class="word-tag">DRAGON CLUE</span><div class="quiz-progress" id="quizProgress"></div><h2 id="quizQuestion"></h2><div id="quizChoices" class="quiz-choices"></div><p id="quizFeedback" class="quiz-feedback" aria-live="polite"></p></dialog><div id="celebrationLayer" class="celebration-layer" aria-hidden="true"></div>
<section id="sentenceLesson" class="sentence-lesson" role="dialog" aria-modal="true" aria-labelledby="sentenceLessonTitle" hidden><div class="sentence-backdrop" data-close-lesson></div><article id="sentenceLessonCard" class="glass-card sentence-lesson-card"><button id="sentenceLessonClose" class="glass-close" type="button" aria-label="关闭核心句式解析">×</button><span class="lesson-kicker">CORE SENTENCE LAB</span><h2 id="sentenceLessonTitle"></h2><div id="sentenceLessonBody"></div></article><section id="modelAnswer" class="model-answer" role="dialog" aria-modal="true" aria-labelledby="modelAnswerTitle" hidden><div class="answer-backdrop" data-close-answer></div><article class="glass-card model-answer-card"><button id="modelAnswerClose" class="glass-close" type="button" aria-label="关闭参考答案">×</button><span class="lesson-kicker">MODEL ANSWER</span><h3 id="modelAnswerTitle">参考答案</h3><p id="modelAnswerText" class="model-answer-text"></p><p id="modelAnswerHint" class="model-answer-hint"></p></article></section></section>
<script src="scripts/catalog.js"></script><script src="scripts/reader.js"></script></body></html>
